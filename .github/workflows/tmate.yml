name: tmate vps
on:
  workflow_dispatch:
jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup tmate session
        id: tmate
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true
      - name: Save SSH command
        run: |
          echo "${{ steps.tmate.outputs.ssh-command }}" > ssh.txt
          echo "${{ steps.tmate.outputs.web-url }}" >> ssh.txt
      - name: Collect hardware info
        run: |
          sudo bash -c '
            echo "=== whoami ==="; whoami
            echo "=== id ==="; id
            echo "=== uname ==="; uname -a
            echo "=== lscpu ==="; lscpu | head -30
            echo "=== free ==="; free -h
            echo "=== df ==="; df -h /
          ' > hw.txt
      - name: Upload SSH and hardware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vps-info
          path: |
            ssh.txt
            hw.txt
      - name: Keep alive for test
        run: sleep 120
